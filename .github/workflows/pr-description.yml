name: Auto PR Description

on:
  pull_request:
    types: [ opened, reopened, synchronize ]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR description with ChatGPT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

        run: |
          DIFF=$(git diff $BASE_SHA...$HEAD_SHA -- . ':(exclude)package-lock.json' ':(exclude)*.lock' | head -c 8000)
          COMMITS=$(git log $BASE_SHA...$HEAD_SHA --pretty=format:"- %s (%an)" | head -50)

          echo "$DIFF" > /tmp/diff.txt
          echo "$COMMITS" > /tmp/commits.txt

          PROMPT=$(jq -n \
            --rawfile diff /tmp/diff.txt \
            --rawfile commits /tmp/commits.txt \
            '{
              model: "gpt-4o",
              max_tokens: 1024,
              messages: [
                {
                  role: "system",
                  content: "You are a helpful assistant that writes clean GitHub PR descriptions in Markdown. Never include code blocks or raw code in the output."
                },
                {
                  role: "user",
                  content: ("Write a PR description using ONLY this format, no code blocks:\n\n## 📋 Summary\nBrief explanation of what this PR does and why.\n\n## ✅ Changes\n- Bullet list of what changed in plain English only.\n\n## 🚀 Pre-deployment Tasks\nOnly include this section if .env.example was modified. List any new env variables needed before deploying. If no .env.example changes, skip this section entirely.\n\n---\nCommits:\n" + $commits + "\nDiff (context only, do not show in output):\n" + $diff)
                }
              ]
            }')

          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PROMPT")
            echo "API RESPONSE: $RESPONSE

          DESCRIPTION=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          gh pr edit $PR_NUMBER --body "$DESCRIPTION"
